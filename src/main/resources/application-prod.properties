spring.application.name=backend

# Base de datos - Producción (MySQL en Docker)
spring.datasource.url=jdbc:mysql://db:3306/${DB_NAME:f1_manager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Logging - Producción (solo errores)
logging.level.root=WARN
logging.level.com.f1manager.backend=INFO

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
